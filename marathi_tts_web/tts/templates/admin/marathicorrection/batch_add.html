{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div id="content-main">
    <h1>{% translate "Batch Add Corrections" %}</h1>
    <div class="module">
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label>{% translate "Enter corrections (one per line)" %}:</label>
                <textarea name="corrections_text" rows="10" style="width: 90%;" required></textarea>
            </div>
            <div class="help">
                Format: incorrect_text,correct_text,category,notes<br>
                Example: भ्‌ गवान,भगवान,zero_width_error,Common in web text
            </div>
            <div class="submit-row">
                <input type="submit" value="{% translate 'Add Corrections' %}" class="default">
                <a href="../" class="button">{% translate 'Cancel' %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
