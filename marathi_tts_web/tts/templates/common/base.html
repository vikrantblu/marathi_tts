{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=3.0, user-scalable=yes">
    <title>{% block title %}Default Title{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'tts/image/favicon.ico' %}">

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,500,600,700,800&display=swap">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'tts/css/common/jquery-ui.css' %}">
    <link rel="stylesheet" href="{% static 'tts/css/common/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'tts/css/common/jquery.fancybox.min.css' %}">
    <link rel="stylesheet" href="{% static 'tts/css/common/base.css' %}">
    
    <!-- Section-specific CSS -->
    {% block extra_css %}{% endblock %}

    <style>
        /* Common responsive styles */
        @media (max-width: 768px) {
            .main-content {
                margin-top: 50px;
                padding: 10px;
            }
            
            .container {
                padding: 10px;
            }
        }

        /* Common security features */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>

    <!-- Add nonce for CSP -->
    <script nonce="{{ request.csp_nonce }}" defer src="{% static 'tts/js/core/tts.js' %}" type="module"></script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'tts/js/common/jquery-3.6.0.min.js' %}" defer></script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'tts/js/common/jquery-ui.min.js' %}" defer></script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'tts/js/common/bootstrap.min.js' %}" defer></script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'tts/js/common/jquery.fancybox.min.js' %}" defer></script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'tts/js/common/chart.js' %}" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'tts/js/common/jquery.fancybox.min.js' %}"></script>

    {% csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <header class="top-header">
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        {% else %}
            <a class="btn-logout" href="{% url 'login' %}">Login</a>
        {% endif %}
    </header>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script nonce="{{ request.csp_nonce }}">
        // Common security features
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'PrintScreen') {
                document.body.style.display = 'none';
                alert('Screenshots are not allowed on this website.');
                setTimeout(function() {
                    document.body.style.display = 'block';
                }, 100);
            }
        });
    </script>

    <script>
        // Debug script to help diagnose modal issues
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page fully loaded, checking modal components');
            
            // Check if Bootstrap is loaded
            if (typeof bootstrap !== 'undefined') {
                console.log('Bootstrap version:', bootstrap.Collapse.VERSION);
            } else {
                console.error('Bootstrap is not loaded!');
            }
            
            // Check if the modal exists
            const modal = document.getElementById('textCorrectionModal');
            if (modal) {
                console.log('Modal element found in DOM');
            } else {
                console.error('Modal element not found in DOM');
            }
            
            // Check if diff_match_patch is loaded
            if (typeof diff_match_patch === 'function') {
                console.log('diff_match_patch library loaded');
            } else {
                console.error('diff_match_patch library not loaded');
            }
            
            // Check if DiffDisplay is available
            if (window.DiffDisplay) {
                console.log('DiffDisplay utility found');
            } else {
                console.error('DiffDisplay utility not found');
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
