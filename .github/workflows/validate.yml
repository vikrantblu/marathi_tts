name: Validate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check TTS engine syntax (all 3 platforms)
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          ok = 0
          for d in ['marathi_tts_web/tts', 'marathi_tts_desktop/python_bridge/tts',
                     'marathi_tts_mobile/app/src/main/python/tts']:
              for f in pathlib.Path(d).rglob('*.py'):
                  try:
                      ast.parse(f.read_text('utf-8'))
                      ok += 1
                  except SyntaxError as e:
                      errors.append(f'{f}: {e}')
          if errors:
              print(f'{ok} OK, {len(errors)} errors:')
              for e in errors: print(f'  {e}')
              sys.exit(1)
          print(f'All {ok} files syntax-clean')
          "

      - name: Check bridge scripts syntax
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          ok = 0
          for d in ['marathi_tts_desktop/python_bridge', 'marathi_tts_mobile/app/src/main/python']:
              for f in pathlib.Path(d).glob('*_bridge.py'):
                  try:
                      ast.parse(f.read_text('utf-8'))
                      ok += 1
                  except SyntaxError as e:
                      errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print(f'All {ok} bridge scripts syntax-clean')
          "

  kotlin-compile:
    name: Kotlin Compile Check (Mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle compile check
        working-directory: marathi_tts_mobile
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon 2>&1 || echo "::warning::Kotlin compilation had issues (may be expected without local.properties SDK path)"

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version.json matches build.gradle.kts
        run: |
          python -c "
          import json, re, sys
          vj = json.load(open('version.json'))
          gradle = open('marathi_tts_mobile/app/build.gradle.kts').read()
          gv = re.search(r'versionName\s*=\s*\"([^\"]+)\"', gradle)
          gc = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          ok = True
          if gv and gv.group(1) != vj['version']:
              print(f'MISMATCH: version.json={vj[\"version\"]} vs gradle={gv.group(1)}')
              ok = False
          if gc and int(gc.group(1)) != vj['buildNumber']:
              print(f'MISMATCH: version.json buildNumber={vj[\"buildNumber\"]} vs gradle versionCode={gc.group(1)}')
              ok = False
          if ok:
              print(f'Version consistent: v{vj[\"version\"]} (build {vj[\"buildNumber\"]})')
          else:
              sys.exit(1)
          "

  tts-sync-check:
    name: TTS Engine Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared tts/ engine files are in sync across platforms
        run: |
          python -c "
          import pathlib, hashlib, sys

          # Django-only paths that legitimately exist only in the web platform
          WEB_ONLY_PREFIXES = [
              'admin', 'apps', 'urls', 'models/', 'migrations/',
              'management/', 'views/', 'utils.py',
              'utils/ai/', 'utils/voice/', 'utils/nlp/',
              'utils/security', 'utils/core/base_service',
              'utils/core/google_service', 'utils/core/offline_tts',
              'utils/core/tts_service', 'utils/core/tts_settings',
              'utils/audio/audio_processor', 'utils/audio/audio_utils',
              'utils/audio/pause_handler', 'utils/text/text_analyzer',
          ]
          # Files with intentional platform-specific differences (try/except guards)
          KNOWN_DRIFTED = [
              'utils/core/tts_engine.py',       # ImportError guards for Django
              'utils/emotion/emotion_analyzer.py',  # numpy/Django optional
              'utils/logging_config.py',         # Django import guarded
              'utils/text/text_normalizer.py',   # indicnlp import guarded
              'utils/text/text_processor.py',    # transformers lazy import
          ]
          def is_web_only(rel_str):
              return any(rel_str.startswith(p) for p in WEB_ONLY_PREFIXES)
          def is_known_drifted(rel_str):
              return rel_str in KNOWN_DRIFTED

          web = pathlib.Path('marathi_tts_web/tts')
          desk = pathlib.Path('marathi_tts_desktop/python_bridge/tts')
          mob = pathlib.Path('marathi_tts_mobile/app/src/main/python/tts')
          issues = []
          skipped = 0
          for f in sorted(web.rglob('*.py')):
              rel = f.relative_to(web)
              rel_str = str(rel).replace(chr(92), '/')
              if is_web_only(rel_str):
                  skipped += 1
                  continue
              if is_known_drifted(rel_str):
                  skipped += 1
                  continue
              wh = hashlib.md5(f.read_bytes()).hexdigest()
              for name, base in [('desktop', desk), ('mobile', mob)]:
                  other = base / rel
                  if not other.exists():
                      issues.append(f'MISSING [{name}] {rel_str}')
                  elif hashlib.md5(other.read_bytes()).hexdigest() != wh:
                      issues.append(f'DRIFTED [{name}] {rel_str}')
          if issues:
              print(f'TTS engine files out of sync ({skipped} web-only skipped):')
              for d in issues: print(f'  {d}')
              sys.exit(1)
          print(f'All shared TTS engine files in sync ({skipped} web-only skipped)')
          "
